# Nightly extractor smoke check: verifies sample embed links against live
# upstream hosts and produces a step summary report.
name: smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Extractor smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Run extractor smoke tests
        shell: bash
        env:
          ANICLITR_SMOKE: "1"
        run: |
          set +e
          go test -v ./internal/extract -run TestSmoke 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          {
            echo "### Çözümleyici Smoke Raporu (${{ matrix.os }})"
            echo ""
            echo '```text'
            cat smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
